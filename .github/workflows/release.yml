name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - name: Build compendium packs
        run: npm run build:packs
      - name: Stamp version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          jq --arg v "$VERSION" '.version = $v' system.json > system.tmp && mv system.tmp system.json
      - name: Package
        run: zip -r system.zip system.json scripts styles templates lang packs README.md -x "packs/_source/*"
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            system.json
            system.zip
